name: "CI"
permissions:
  contents: read

on:
  push:
    branches: [main, deploy/**]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  RAILS_IMAGENAME: registry.digitalocean.com/nsgcr/cobra
  SVELTE_IMAGENAME: registry.digitalocean.com/nsgcr/cobra-frontend

jobs:
  ci:
    name: "Continuous Integration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.5-alpine
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      POSTGRES_DB: rails_test
      POSTGRES_USER: rails
      POSTGRES_PASSWORD: password
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true

      - name: Set up Rails
        run: |
          cp config/database.ci.yml config/database.yml

      - name: Set up database schema
        run: |
          bin/rails db:reset --trace

      - name: Install NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install NPM dependencies
        run: npm install
      
      - name: Install frontend NPM dependencies
        working-directory: ./frontend
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run CI
        run: bundle exec bin/ci
      
      - name: Run svelte-check
        working-directory: ./frontend
        run: npm run check

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build_and_push:
    name: Build docker image
    if: (github.repository_owner == 'Null-Signal-Games' &&  (github.ref == 'refs/heads/main' || github.event_name == 'release'))

    needs: [ci]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build, tag, and publish image
        env:
          IMAGETAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          docker build -t $RAILS_IMAGENAME:$IMAGETAG .
          docker tag $RAILS_IMAGENAME:$IMAGETAG $RAILS_IMAGENAME:${{ github.run_id }}
          docker push -a $RAILS_IMAGENAME

  build_and_push_frontend:
    name: Build frontend docker image
    if: (github.repository_owner == 'Null-Signal-Games' &&  (github.ref == 'refs/heads/main' || github.event_name == 'release'))

    needs: [ci]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build, tag, and publish image
        env:
          IMAGETAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          docker build -f deploy/Dockerfile.frontend -t $SVELTE_IMAGENAME:$IMAGETAG frontend
          docker tag $SVELTE_IMAGENAME:$IMAGETAG $SVELTE_IMAGENAME:${{ github.run_id }}
          docker push -a $SVELTE_IMAGENAME
