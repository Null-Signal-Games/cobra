name: "CI"
permissions:
  contents: read

on:
  push:
    branches: [main, deploy/**]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  RAILS_IMAGENAME: registry.digitalocean.com/nsgcr/cobra
  SVELTE_IMAGENAME: registry.digitalocean.com/nsgcr/cobra-frontend

jobs:
  ruby_checks:
    name: "Ruby checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: "Style: Ruby"
        run: bin/rubocop

      - name: "Security: Gem audit"
        if: ${{ !cancelled() }}
        run: bin/bundler-audit

      - name: "Security: Brakeman code analysis"
        if: ${{ !cancelled() }}
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  rspec:
    name: "RSpec"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.5-alpine
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      POSTGRES_DB: rails_test
      POSTGRES_USER: rails
      POSTGRES_PASSWORD: password
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Set up Rails
        run: |
          cp config/database.ci.yml config/database.yml

      - name: Set up database schema
        run: |
          bin/rails db:reset --trace

      # vite_ruby has autoBuild enabled for test, so views rendered by specs may
      # build assets with Vite.
      - name: Install NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      - name: "Tests: RSpec"
        run: bundle exec rspec

      - name: "Tests: Seeds"
        if: ${{ !cancelled() }}
        run: bin/rails db:seed:replant

  js:
    name: "JS lint and unit tests"
    runs-on: ubuntu-latest
    env:
      VITE_RUBY_ROOT: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install NPM dependencies
        run: npm ci

      # `npm run lint` also lints frontend/, which needs its dependencies and
      # the .svelte-kit directory generated by its prepare script.
      - name: Install frontend NPM dependencies
        working-directory: ./frontend
        run: npm ci

      - name: "Lint: Javascript"
        run: npm run lint

      - name: "Lint: Svelte"
        if: ${{ !cancelled() }}
        run: npm run svelte-check

      - name: "Tests: Vitest"
        if: ${{ !cancelled() }}
        run: npm run test

  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install NPM
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # SvelteKit's env loader resolves the root tsconfig.json, which extends
      # @tsconfig/svelte from the root dependencies.
      - name: Install root NPM dependencies
        working-directory: .
        run: npm ci

      - name: Install NPM dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: "Tests: Vitest"
        run: npm run test

      - name: Run svelte-check
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Build frontend
        if: ${{ !cancelled() }}
        run: npm run build

  # Single result for the jobs above. The image builds depend on it, and it keeps
  # the "Continuous Integration" check name for branch protection.
  ci:
    name: "Continuous Integration"
    if: ${{ always() }}
    needs: [ruby_checks, rspec, js, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  build_and_push:
    name: Build Rails docker image
    if: (github.repository_owner == 'Null-Signal-Games' &&  (github.ref == 'refs/heads/main' || github.event_name == 'release'))

    needs: [ci]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build, tag, and publish Rails image
        env:
          IMAGETAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          docker build -t $RAILS_IMAGENAME:$IMAGETAG .
          docker tag $RAILS_IMAGENAME:$IMAGETAG $RAILS_IMAGENAME:${{ github.run_id }}
          docker push -a $RAILS_IMAGENAME

  build_and_push_frontend:
    name: Build Svelte frontend docker image
    if: (github.repository_owner == 'Null-Signal-Games' &&  (github.ref == 'refs/heads/main' || github.event_name == 'release'))

    needs: [ci]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build, tag, and publish Svelte frontend image
        env:
          IMAGETAG: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
        run: |
          docker build -f deploy/Dockerfile.frontend -t $SVELTE_IMAGENAME:$IMAGETAG frontend
          docker tag $SVELTE_IMAGENAME:$IMAGETAG $SVELTE_IMAGENAME:${{ github.run_id }}
          docker push -a $SVELTE_IMAGENAME
