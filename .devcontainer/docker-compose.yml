services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces/cobra:cached,z
      - bundle-data:/home/vscode/.bundle
      - command-history:/commandhistory

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:14.5
    restart: unless-stopped
    # nginx in app (port 80, see bin/dev-stack) is the only port published to the host. It's declared
    # here because app runs in db's network. Host 3000 matches the NRDB OAuth redirect_uri.
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-db-user.sql:/docker-entrypoint-initdb.d/create-db-user.sql
    environment:
      POSTGRES_USER: cobra
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: cobra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobra -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  bundle-data:
  command-history:
