# This file is an nginx envsubst template: mount it at /etc/nginx/templates/default.conf.template
# and set COBRA_RAILS_UPSTREAM and COBRA_SVELTE_UPSTREAM (host:port) in the gateway's environment.

# Upstream for Rails Puma application server
upstream rails_upstream {
    server ${COBRA_RAILS_UPSTREAM};
    keepalive 32;
}

# Upstream for Node.js SvelteKit server
upstream node_upstream {
    server ${COBRA_SVELTE_UPSTREAM};
    keepalive 32;
}

# Pass WebSocket upgrades through (Vite HMR in development), otherwise clear Connection for keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # --- Common Proxy Parameters ---
    # $http_host keeps the client's port so Rails builds correct absolute URLs when not on 80/443.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # HTTP/1.1 with Connection cleared lets the upstream keepalive pools reuse connections.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # --- Modern Rails APIs ---
    location /api/v1/ {
        proxy_pass http://rails_upstream;
    }

    # --- OAuth Authentication Routes ---
    location /oauth/ {
        proxy_pass http://rails_upstream;
    }

    # --- Rails 8 Built-in Healthcheck ---
    location = /up {
        proxy_pass http://rails_upstream;
    }

    # --- Classic Rails Endpoints (/api/classic/ - Literal & Prunable) ---
    location = /api/classic/csrf_token {
        proxy_pass http://rails_upstream;
    }

    location = /api/classic/tournaments/new_form {
        proxy_pass http://rails_upstream;
    }

    location = /api/classic/tournaments/new_demo_form {
        proxy_pass http://rails_upstream;
    }

    location = /api/classic/tournaments/create_demo {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/edit_form$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/players/standings_data$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/rounds/brackets$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/rounds/pairings_data(/.*)?$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/save_json$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/stages/[0-9]+/settings$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments/[0-9]+/upload_to_abr$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/api/classic/tournaments(/[0-9]+(/stages/[0-9]+)?)?$ {
        proxy_pass http://rails_upstream;
    }

    # --- Active Beta Rails Endpoints (/beta/ - Literal & Prunable) ---
    location ~ ^/beta/tournaments/[0-9]+/current_round_timer$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/id_and_faction_data$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/cut_conversion_rates$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/(open_registration|close_registration|lock_player_registrations|unlock_player_registrations)$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/cut$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/stages(/[0-9]+)?$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/players/players_data$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/players/decks$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/players/[0-9]+/nrdb_decks$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/players/[0-9]+/decks$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/players/[0-9]+/(drop|reinstate|lock_registration|unlock_registration)$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/players(/[0-9]+)?$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/rounds/pairings_data$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/rounds/[0-9]+/round_data$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/rounds/[0-9]+/(repair|complete|update_timer)$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/rounds/[0-9]+/pairings/[0-9]+/(report|reset_self_report)$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/rounds/[0-9]+/pairings(/[0-9]+)?$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/beta/tournaments/[0-9]+/rounds(/[0-9]+)?$ {
        proxy_pass http://rails_upstream;
    }

    # --- Classic Rails Tournament Exports & Actions (/tournaments/ - Literal & Prunable) ---
    location ~ ^/tournaments/[0-9]+\.json$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/tournaments/[0-9]+/save_json$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/tournaments/[0-9]+/upload_to_abr$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/tournaments/[0-9]+/players/download_decks$ {
        proxy_pass http://rails_upstream;
    }

    location ~ ^/tournaments/[0-9]+/players/download_streaming$ {
        proxy_pass http://rails_upstream;
    }

    # --- SvelteKit Static Assets ---
    location /_app/immutable/ {
        proxy_pass http://node_upstream;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_app/ {
        proxy_pass http://node_upstream;
    }

    location ~ ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png|robots\.txt)$ {
        proxy_pass http://node_upstream;
    }

    # --- SvelteKit Frontend Catch-All ---
    location / {
        proxy_pass http://node_upstream;
        # Any proxy_set_header here drops the server-level ones, so repeat them. adapter-node only
        # uses Host for event.url when ORIGIN is unset. Session cookies reach Rails during SSR via
        # handleFetch in frontend/src/hooks.server.ts, not via SvelteKit's same-origin forwarding.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
