services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - COBRA_RAILS_UPSTREAM=rails:3000
      - COBRA_SVELTE_UPSTREAM=svelte:3000
    depends_on:
      - rails
      - svelte
    networks:
      - backend

  svelte:
    image: registry.digitalocean.com/nsgcr/cobra-frontend:${FRONTEND_VERSION:?set FRONTEND_VERSION in deploy/.env}
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=${COBRA_ORIGIN:?set COBRA_ORIGIN in deploy/.env}
      - SERVER_COBRA_API_ENDPOINT=http://gateway
    networks:
      - backend

  rails:
    image: registry.digitalocean.com/nsgcr/cobra:${COBRA_SERVER_VERSION:?set COBRA_SERVER_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: Dockerfile
    # Rails-only secrets. Shared settings come from deploy/.env below so each value has one home.
    env_file:
      - path: rails.env
        required: true
    environment:
      - RAILS_ENV=${RAILS_ENV:?set RAILS_ENV in deploy/.env}
      - COBRA_DOMAIN=${COBRA_DOMAIN:?set COBRA_DOMAIN in deploy/.env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    depends_on:
      - db
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ../config/database.yml:/var/www/cobra/config/database.yml
      - ../log:/var/www/cobra/log
      - cobra-tmp:/var/www/cobra/tmp
    networks:
      - backend

  db:
    image: postgres:14.5-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      - POSTGRES_DB=${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - cobra-postgres:/var/lib/postgresql/data
      - ../postgres-docker-init.sql:/docker-entrypoint-initdb.d/postgres-docker-init.sql
    networks:
      - backend

volumes:
  cobra-postgres:
  cobra-tmp:

networks:
  backend:
